    function paywallHTML(){return`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60" onclick="closePaywall()"><div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden" onclick="event.stopPropagation()"><div class="bg-gray-900 text-white p-6 text-center"><h2 class="text-xl font-bold">Unlock Premium</h2><p class="text-gray-300 text-sm mt-1">Get unlimited access to all episodes</p></div><div class="p-4 space-y-3"><div class="grid grid-cols-3 gap-2">${plans.map(p=>`<div onclick="state.selectedPlan='${p.id}';render()" class="relative p-3 rounded-xl border-2 cursor-pointer transition-all text-center ${state.selectedPlan===p.id?'border-gray-900 bg-gray-100':'border-gray-200 hover:border-gray-400'}">${p.tag?`<span class="absolute -top-2 left-1/2 -translate-x-1/2 px-2 py-0.5 bg-red-500 text-white text-xs font-bold rounded-full whitespace-nowrap">${p.tag==='70% OFF'?'HOT':p.tag}</span>`:''}<h3 class="font-semibold text-gray-900 text-sm">${p.name.split(' ')[0]}</h3><div class="mt-1"><span class="text-lg font-bold text-gray-900">$${p.price}</span></div><p class="text-xs text-gray-500 mt-1">${p.id==='3day'?'3 days':p.id==='7day'?'7 days':'14 days'}</p></div>`).join('')}</div><div class="bg-gray-50 rounded-xl p-3 space-y-1"><div class="flex items-center text-sm text-gray-700"><span class="text-green-500 mr-2">✓</span>Watch all episodes</div><div class="flex items-center text-sm text-gray-700"><span class="text-green-500 mr-2">✓</span>New episodes priority</div></div><div class="flex gap-2 mb-2"><button onclick="state.selectedPayment='paypal';render()" class="flex-1 flex items-center justify-center gap-2 py-3 border-2 rounded-xl transition-colors ${state.selectedPayment==='paypal'?'border-gray-900 bg-gray-100':'border-gray-200 hover:border-gray-400'}"><svg class="w-5 h-5" fill="#003087" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8z"/></svg><span class="font-medium ${state.selectedPayment==='paypal'?'text-gray-900':'text-gray-700'}">PayPal</span></button><button onclick="state.selectedPayment='card';render()" class="flex-1 flex items-center justify-center gap-2 py-3 border-2 rounded-xl transition-colors ${state.selectedPayment==='card'?'border-gray-900 bg-gray-100':'border-gray-200 hover:border-gray-400'}"><svg class="w-5 h-5" fill="#1a1f71" viewBox="0 0 24 24"><rect width="24" height="24" rx="4"/><text x="6" y="16" fill="white" font-size="10" font-weight="bold">VISA</text></svg><span class="font-medium ${state.selectedPayment==='card'?'text-gray-900':'text-gray-700'}">Card</span></button></div><button onclick="handleSubscribe()" class="w-full py-4 bg-gray-900 text-white font-bold rounded-xl hover:bg-gray-800 transition-all shadow-lg">${state.isLoggedIn?'Subscribe Now - $'+plans.find(p=>p.id===state.selectedPlan)?.price:'Login to Subscribe'}</button><p class="text-xs text-gray-500 text-center">By subscribing, you agree to our <span class="text-gray-700 underline cursor-pointer">Terms</span> & <span class="text-gray-700 underline cursor-pointer">Privacy</span></p></div></div></div>`;}
    function retentionHTML(){const mins=Math.floor(state.countdown/60),secs=state.countdown%60;return`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70" onclick="closeRetention()"><div class="relative bg-white rounded-2xl shadow-2xl max-w-sm w-full overflow-hidden" onclick="event.stopPropagation()"><div class="bg-red-500 text-white text-center py-2 text-sm font-bold">LIMITED OFFER</div><div class="p-6 text-center"><h2 class="text-2xl font-bold text-gray-900 mb-2">Wait! Special Deal</h2><p class="text-gray-600 mb-4">Get 60% OFF your first subscription</p><div class="flex items-center justify-center gap-2 mb-4"><svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd"/></svg><span class="font-mono font-bold text-lg text-red-500">${mins}:${secs.toString().padStart(2,'0')}</span></div><div class="bg-gray-100 rounded-xl p-4 mb-4"><div class="flex items-center justify-center gap-4"><span class="text-gray-400 line-through text-lg">$19.98</span><span class="text-3xl font-bold text-gray-900">$2.99</span></div><p class="text-sm text-gray-600 mt-2">3-Day VIP Pass</p></div><button onclick="handleRetentionSubscribe()" class="w-full py-4 bg-gray-900 text-white font-bold rounded-xl mb-3 shadow-lg hover:bg-gray-800">Claim Offer - $2.99</button><button onclick="closeRetention()" class="text-gray-500 text-sm hover:text-gray-700">No Thanks</button></div></div></div>`;}
    function paymentHTML(){const plan=plans.find(p=>p.id===state.selectedPlan);return`<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60"><div class="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden"><div class="bg-gray-900 text-white p-6 text-center"><h2 class="text-xl font-bold">Complete Payment</h2><p class="text-gray-300 text-sm mt-1">Secure payment processing</p></div><div class="p-6 space-y-4"><div class="bg-gray-50 rounded-xl p-4"><div class="flex justify-between items-center mb-2"><span class="text-gray-600">Plan</span><span class="font-medium text-gray-900">${plan?.name}</span></div><div class="flex justify-between items-center mb-2"><span class="text-gray-600">Payment Method</span><span class="font-medium text-gray-900">${state.selectedPayment==='paypal'?'PayPal':'Credit Card'}</span></div><div class="border-t border-gray-200 pt-2 mt-2 flex justify-between items-center"><span class="font-semibold text-gray-900">Total</span><span class="text-2xl font-bold text-gray-900">$${plan?.price}</span></div></div>${state.selectedPayment==='card'?'<div class="space-y-3"><input type="text" placeholder="Card Number" value="4242 4242 4242 4242" class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-gray-400"/><div class="flex gap-2"><input type="text" placeholder="MM/YY" value="12/28" class="flex-1 px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-gray-400"/><input type="text" placeholder="CVC" value="123" class="w-24 px-4 py-3 border-2 border-gray-200 rounded-xl focus:outline-none focus:border-gray-400"/></div></div>':'<div class="bg-blue-50 rounded-xl p-4 text-center"><p class="text-blue-800 text-sm">Click "Pay Now" to complete your PayPal payment</p></div>'}<button onclick="handlePaymentSuccess()" class="w-full py-4 bg-green-600 text-white font-bold rounded-xl hover:bg-green-700 transition-colors shadow-lg">Pay $${plan?.price}</button><button onclick="cancelPayment()" class="w-full py-3 text-gray-600 hover:text-gray-900 text-sm">Cancel</button></div></div></div>`;}

    function attachEvents(){}
    function goHome(){state={...state,view:'home',selectedNovel:null,currentChapter:null,showTOC:false};render();}
    function openNovel(id){state.selectedNovel=novels.find(n=>n.id===id);state.view='detail';render();}
    function readChapter(id){const novel=state.selectedNovel;if(!novel)return;const ch=novel.chapters.find(c=>c.id===id);if(!ch)return;state.currentChapter=ch;state.view='reading';state.showTOC=false;state.isLockedPreview=ch.id>FREE_CHAPTER_COUNT&&!state.isVip;render();}
    function prevChapter(){if(!state.currentChapter||state.currentChapter.id<=1)return;readChapter(state.currentChapter.id-1);}
    function nextChapter(){if(!state.currentChapter||!state.selectedNovel||state.currentChapter.id>=state.selectedNovel.chapters.length)return;readChapter(state.currentChapter.id+1);}
    function goDetail(){state.view='detail';render();}
    function openTOC(){state.showTOC=true;render();}
    function closeTOC(){state.showTOC=false;render();}
    function openLogin(){state.showLoginModal=true;render();}
    function closeLogin(){state.showLoginModal=false;render();}
    function openPaywall(){state.showPaywall=true;render();}
    function closePaywall(){state.showPaywall=false;state.showRetention=true;startCountdown();render();}
    function closeRetention(){state.showRetention=false;render();}
    function openPayment(){state.showPayment=true;render();}
    function cancelPayment(){state.showPayment=false;state.showPaywall=true;render();}
    function toggleDarkMode(){state.darkMode=!state.darkMode;render();}
    function toggleUserMenu(){state.showUserMenu=!state.showUserMenu;render();}
    function login(){state.isLoggedIn=true;state.showLoginModal=false;state.showUserMenu=false;if(state.pendingSubscribe){state.pendingSubscribe=false;openPayment();}render();}
    function logout(){state.isLoggedIn=false;state.isVip=false;state.vipExpireDate=null;state.showUserMenu=false;render();}
    function handleSubscribe(){if(!state.isLoggedIn){state.showPaywall=false;state.showLoginModal=true;state.pendingSubscribe=true;render();return;}openPayment();}
    function handleRetentionSubscribe(){state.selectedPlan='3day';state.selectedPayment='paypal';state.showRetention=false;openPayment();}
    function handlePaymentSuccess(){state.isVip=true;const now=new Date();const days=state.selectedPlan==='3day'?3:state.selectedPlan==='7day'?7:14;now.setDate(now.getDate()+days);state.vipExpireDate=now.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});state.showPayment=false;state.showRetention=false;if(state.currentChapter)state.isLockedPreview=state.currentChapter.id>FREE_CHAPTER_COUNT&&!state.isVip;render();}
    function startCountdown(){state.countdown=300;setInterval(()=>{if(state.countdown>0){state.countdown--;if(document.getElementById('countdown'))document.getElementById('countdown').textContent=Math.floor(state.countdown/60)+':'+(state.countdown%60).toString().padStart(2,'0');}},1000);}
    render();
  </script>
